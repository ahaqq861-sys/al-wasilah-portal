{% extends 'portal/base.html' %}

{% block title %}Edit Result Entry - {{ branding.school_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Edit Academic Result</h4>
    <a href="{% url 'portal:manage_results' %}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back to Results List</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="portal-card p-4">
            <h6 class="fw-bold mb-3 pb-2 border-bottom" style="color: var(--brand-primary);">
                Updating Result for {{ result.student.get_full_name|default:result.student.username }}
            </h6>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Subject Name</label>
                    <input type="text" name="subject_name" value="{{ result.subject_name }}" class="form-control" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Class Score (40%)</label>
                        <input type="number" step="0.01" name="class_score" value="{{ result.class_score }}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Exam Score (60%)</label>
                        <input type="number" step="0.01" name="exam_score" value="{{ result.exam_score }}" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Academic Term</label>
                        <input type="text" name="academic_term" value="{{ result.academic_term }}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Position in Subject</label>
                        <input type="text" name="position_in_subject" value="{{ result.position_in_subject|default:'' }}" class="form-control">
                    </div>
                </div>

                <button type="submit" class="btn btn-brand fw-bold px-4"><i class="fa-solid fa-floppy-disk me-2"></i> Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
