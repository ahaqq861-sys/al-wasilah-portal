{% extends 'portal/base.html' %}

{% block title %}Portal Branding - {{ branding.school_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Portal Branding</h4>
    <small class="text-muted">Admin / Settings</small>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="portal-card p-4">
            <h6 class="fw-bold mb-3 border-bottom pb-2" style="color: var(--brand-primary);">
                <i class="fa-solid fa-sliders me-2"></i>Custom Branding & School Information
            </h6>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">School Name</label>
                    <input type="text" name="school_name" value="{{ branding.school_name }}" class="form-control" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Contact Email</label>
                        <input type="email" name="contact_email" value="{{ branding.contact_email }}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Contact Phone</label>
                        <input type="text" name="contact_phone" value="{{ branding.contact_phone }}" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Address</label>
                    <textarea name="address" class="form-control" rows="2">{{ branding.address }}</textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">School Crest / Logo</label>
                    <input type="file" name="logo" class="form-control">
                </div>
                <button type="submit" class="btn btn-brand fw-bold px-4">Save Branding Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
