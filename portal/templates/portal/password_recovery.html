<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Recovery - {{ branding.school_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
        <h4 class="fw-bold mb-1 text-primary">Password Recovery</h4>
        <p class="small text-muted mb-3">Enter your username/ID to reset your password back to default (123456).</p>
        {% if messages %}
            {% for m in messages %}<div class="alert alert-info small py-2">{{ m }}</div>{% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold small">Username / Student ID</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 fw-bold">Reset to Default (123456)</button>
            <a href="{% url 'root_login' %}" class="btn btn-link w-100 mt-2 text-decoration-none small">Back to Login</a>
        </form>
    </div>
</body>
</html>
