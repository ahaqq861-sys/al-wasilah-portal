<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - {{ branding.school_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
        <h4 class="fw-bold mb-1 text-danger">Security Notice</h4>
        <p class="small text-muted mb-3">Please set your permanent password to continue.</p>
        {% if messages %}
            {% for m in messages %}<div class="alert alert-warning small py-2">{{ m }}</div>{% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold small">New Permanent Password</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">Confirm Permanent Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 fw-bold">Update Password</button>
        </form>
    </div>
</body>
</html>
