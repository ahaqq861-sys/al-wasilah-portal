<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - {{ branding.school_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: {% if branding.login_background %}url('{{ branding.login_background.url }}'){% else %}linear-gradient(135deg, #800020, #17a2b8){% endif %};
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { background: rgba(255, 255, 255, 0.95); padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        {% if branding.logo %}
            <img src="{{ branding.logo.url }}" alt="Logo" class="mb-3 rounded-circle" style="width: 70px; height: 70px; object-fit: cover;">
        {% endif %}
        <h4 class="fw-bold mb-1" style="color: #800020;">{{ branding.school_name }}</h4>
        <p class="text-muted small mb-4">Portal Login</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger small py-2">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label fw-bold small">Username / Index ID</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label fw-bold small">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Default: 123456" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Login to Portal</button>
        </form>

        <div class="mt-3">
            <a href="{% url 'portal:password_recovery' %}" class="small text-decoration-none text-danger fw-bold">
                <i class="fa-solid fa-key me-1"></i> Forgot Password / Password Recovery
            </a>
        </div>
    </div>
</body>
</html>
