<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ branding.school_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-primary: {{ branding.primary_color|default:"#5c1825" }};
            --brand-accent: {{ branding.accent_color|default:"#e6b800" }};
        }
        body {
            background-color: #edf1f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            background: #ffffff;
        }
        .login-header {
            background-color: var(--brand-primary);
            color: #ffffff;
            padding: 25px 20px;
            text-align: center;
        }
        .login-header img {
            max-height: 55px;
            margin-bottom: 10px;
        }
        .btn-brand {
            background-color: var(--brand-primary);
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border: none;
            transition: opacity 0.2s;
        }
        .btn-brand:hover {
            color: #ffffff;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        {% if branding.logo %}
            <img src="{{ branding.logo.url }}" alt="Logo">
        {% else %}
            <i class="fa-solid fa-graduation-cap fs-1 text-warning mb-2"></i>
        {% endif %}
        <h5 class="fw-bold mb-1">{{ branding.school_name|upper }}</h5>
        <div class="small opacity-75">{{ branding.motto }}</div>
    </div>

    <div class="p-4">
        <!-- Message Box for Alerts and Errors -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'danger' }} alert-dismissible fade show small py-2 mb-3" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-1"></i> {{ message }}
                    <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label fw-bold small text-secondary">Username or Index Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username / ID" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-bold small text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-brand w-100 rounded-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal
            </button>
        </form>
    </div>

    <div class="card-footer bg-light text-center py-3 border-0 text-muted small">
        Copyright © 2026 {{ branding.school_name }}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
