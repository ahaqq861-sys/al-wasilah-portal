{% extends 'portal/base.html' %}

{% block title %}Register Users - {{ branding.school_name }}{% endblock %}

{% block content %}
<h3 class="fw-bold text-secondary mb-4">Register User Accounts</h3>

<div class="card border-0 shadow-sm rounded-3 mx-auto" style="max-width: 650px;">
    <div class="card-header text-white fw-bold py-3" style="background-color: var(--brand-wine);">
        Account Registration Form
    </div>
    <div class="card-body p-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info p-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">First Name</label>
                    <input type="text" name="first_name" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Last Name</label>
                    <input type="text" name="last_name" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Role</label>
                    <select name="role" class="form-select">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Assigned Class</label>
                    <input type="text" name="assigned_class" class="form-control" placeholder="e.g. Basic 1">
                </div>
            </div>
            <button type="submit" class="btn text-white w-100 fw-bold mt-4 py-2" style="background-color: var(--brand-wine);">Save User Account</button>
        </form>
    </div>
</div>
{% endblock %}
