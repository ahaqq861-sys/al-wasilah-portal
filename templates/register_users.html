{% extends 'portal/base.html' %}

{% block content %}
<div class="top-navbar d-flex justify-content-between align-items-center mb-4 rounded">
    <h4>Register Users</h4>
    <span>Home / Register Users</span>
</div>

<div class="card border-0 shadow-sm p-4 col-md-8 mx-auto">
    <h5 class="fw-bold mb-3">Add New Student or Teacher</h5>
    <form method="POST">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">User Role</label>
                <select name="role" class="form-select" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Index Number or Class Assigned</label>
                <input type="text" name="identifier" class="form-control" placeholder="e.g. BPM/0022/23 or Form 1 A" required>
            </div>
        </div>
        <button type="submit" class="btn btn-success mt-3 w-100"><i class="fa fa-user-plus me-1"></i> Register Account</button>
    </form>
</div>
{% endblock %}
