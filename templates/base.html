<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ branding.school_name|default:"Al-Wasilah Portal" }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --uds-green: #1b8a44; --uds-dark: #2c3e50; --uds-sidebar: #222d32; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: var(--uds-sidebar); color: #fff; }
        .sidebar .nav-link { color: #b8c7ce; padding: 12px 20px; font-size: 14px; border-left: 3px solid transparent; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #1e282c; color: #fff; border-left-color: var(--uds-green); }
        .top-navbar { background-color: var(--uds-green); color: white; padding: 10px 20px; }
        .brand-header { background-color: #156d35; padding: 15px; text-align: center; font-weight: bold; }
        .main-content { padding: 25px; }
        .card-header-green { background-color: var(--uds-green); color: white; font-weight: bold; }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar Navigation -->
        <div class="col-md-2 sidebar d-none d-md-block">
            <div class="brand-header">
                <i class="fa-solid fa-graduation-cap me-2"></i> {{ branding.school_name|default:"UCM Enterprise" }}
            </div>
            <div class="p-3 text-center border-bottom border-secondary">
                <i class="fa-solid fa-user-circle fa-2x mb-1"></i>
                <div class="small fw-bold text-truncate">{{ request.user.get_full_name|default:request.user.username }}</div>
            </div>
            <ul class="nav flex-column mt-2">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'portal:dashboard' %}">
                        <i class="fa-solid fa-gauge me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'results' %}active{% endif %}" href="{% url 'portal:results' %}">
                        <i class="fa-solid fa-file-invoice me-2"></i> Statement of Results
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'school_fees' %}active{% endif %}" href="{% url 'portal:school_fees' %}">
                        <i class="fa-solid fa-wallet me-2"></i> School Fees Ledger
                    </a>
                </li>
                <li class="nav-item mt-4">
                    <a class="nav-link text-danger" href="{% url 'logout' %}">
                        <i class="fa-solid fa-right-from-bracket me-2"></i> Logout
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Content Area -->
        <div class="col-md-10">
            <div class="top-navbar d-flex justify-content-between align-items-center">
                <div><i class="fa-solid fa-bars me-2"></i> Academic Portal System</div>
                <div class="small"><i class="fa-solid fa-calendar-day me-1"></i> {% now "l, d-M-Y" %}</div>
            </div>
            <div class="main-content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</div>
<script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
