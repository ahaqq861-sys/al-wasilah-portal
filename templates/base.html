<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Portal - {{ branding.school_name }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { width: 250px; background-color: #2c3e50; min-height: 100vh; color: #fff; position: fixed; }
        .sidebar a { color: #cfd8dc; text-decoration: none; padding: 12px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: #1a252f; color: #fff; }
        .main-content { margin-left: 250px; padding: 20px; }
        .top-navbar { background-color: #27ae60; color: white; padding: 10px 20px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="p-3 fs-5 fw-bold bg-success text-white">
        <i class="fa-solid fa-graduation-cap me-2"></i>{{ branding.school_name }}
    </div>
    <div class="p-3 text-muted small">USER: {{ request.user.username|upper }}</div>
    <a href="{% url 'portal:dashboard' %}"><i class="fa fa-tachometer-alt me-2"></i>Dashboard</a>
    <a href="{% url 'portal:terminal_results' %}"><i class="fa fa-graduation-cap me-2"></i>Terminal Results</a>
    <a href="{% url 'portal:student_ledger' %}"><i class="fa fa-receipt me-2"></i>Student Ledger / Fees</a>
    <a href="{% url 'portal:register_users' %}"><i class="fa fa-user-plus me-2"></i>Register Users</a>
    <a href="{% url 'portal:batch_excel_upload' %}"><i class="fa fa-file-excel me-2"></i>Batch Excel Upload</a>
    <a href="{% url 'portal:portal_branding' %}"><i class="fa fa-sliders-h me-2"></i>Portal Branding</a>
</div>

<div class="main-content">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
