{% extends 'portal/base.html' %}

{% block content %}
<div class="top-navbar d-flex justify-content-between align-items-center mb-4 rounded">
    <h4>Batch Excel Upload</h4>
    <span>Home / Batch Upload</span>
</div>

<div class="card border-0 shadow-sm p-4 col-md-8 mx-auto text-center">
    <i class="fa fa-file-excel text-success display-1 mb-3"></i>
    <h5 class="fw-bold">Upload Student or Grade Excel Data</h5>
    <p class="text-muted">Select a valid spreadsheet (.xlsx or .csv) to upload batch registrations or results.</p>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3 text-start">
            <input type="file" name="excel_file" class="form-control" accept=".xlsx, .xls, .csv" required>
        </div>
        <button type="submit" class="btn btn-primary w-100"><i class="fa fa-upload me-1"></i> Process File</button>
    </form>
</div>
{% endblock %}
